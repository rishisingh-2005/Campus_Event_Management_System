<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Certificates - Campus Event Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">

    <style>

        body {
            background: #f5f7fa;
        }

        /* =========================
           CERTIFICATE CARD
           ========================= */

        .certificate-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .certificate-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.12);
        }


        /* =========================
           CERTIFICATE PREVIEW
           ========================= */

        .certificate-preview {

            border: 8px solid #212529;

            border-radius: 6px;

            margin: 15px;

            padding: 20px 15px;

            min-height: 390px;

            position: relative;

            background: white;
        }


        .certificate-preview::before {

            content: "";

            position: absolute;

            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;

            border: 2px solid #6c757d;

            pointer-events: none;
        }


        /* =========================
           LOGO
           ========================= */

        .certificate-logo {

            width: 85px;
            height: 85px;

            object-fit: contain;

            display: block;

            margin: 0 auto 8px auto;

            position: relative;

            z-index: 2;
        }


        .print-logo {

            width: 125px;
            height: 125px;

            object-fit: contain;

            display: block;

            margin: 0 auto 10px auto;
        }


        /* =========================
           PREVIEW TEXT
           ========================= */

        .college-name-preview {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 16px;

            font-weight: bold;

            letter-spacing: 0.5px;

            margin-bottom: 3px;
        }


        .college-subtitle-preview {

            font-size: 11px;

            color: #6c757d;

            margin-bottom: 10px;
        }


        .certificate-icon {

            font-size: 30px;

            margin-bottom: 2px;
        }


        .certificate-title {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 25px;

            font-weight: bold;

            letter-spacing: 1px;
        }


        .certificate-subtitle {

            font-size: 13px;

            color: #6c757d;
        }


        .student-name {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 24px;

            font-weight: bold;

            margin: 15px 0;
        }


        .event-name {

            font-size: 18px;

            font-weight: 600;

            margin-top: 5px;
        }


        .certificate-number {

            font-size: 12px;

            word-break: break-word;
        }


        .certificate-actions {

            padding:
                0
                20px
                20px
                20px;
        }


        /* =========================
           PRINT AREA
           ========================= */

        #printCertificate {

            display: none;
        }


        /* =========================
           PRINT DESIGN
           ========================= */

        @media print {

            body * {

                visibility: hidden;
            }


            #printCertificate,
            #printCertificate * {

                visibility: visible;
            }


            #printCertificate {

                display: block;

                position: absolute;

                left: 0;
                top: 0;

                width: 100%;
                height: 100%;
            }


            .print-certificate-page {

                width: 100%;

                min-height: 100vh;

                display: flex;

                align-items: center;

                justify-content: center;

                padding: 30px;
            }


            .print-certificate {

                width: 100%;

                min-height: 650px;

                border: 12px solid #212529;

                padding: 35px;

                text-align: center;

                position: relative;

                background: white;
            }


            .print-certificate-inner {

                border: 3px solid #6c757d;

                min-height: 550px;

                padding:
                    25px
                    40px;

                display: flex;

                flex-direction: column;

                justify-content: center;
            }


            .print-icon {

                font-size: 45px;

                margin-bottom: 3px;
            }


            .college-name {

                font-family:
                    Georgia,
                    "Times New Roman",
                    serif;

                font-size: 28px;

                font-weight: bold;

                letter-spacing: 1px;

                margin-top: 5px;
            }


            .college-subtitle {

                font-size: 16px;

                color: #666;

                margin-top: 5px;

                margin-bottom: 10px;
            }


            .print-title {

                font-family:
                    Georgia,
                    "Times New Roman",
                    serif;

                font-size: 42px;

                font-weight: bold;

                margin: 15px 0;
            }


            .print-subtitle {

                font-size: 18px;

                color: #555;
            }


            .print-student {

                font-family:
                    Georgia,
                    "Times New Roman",
                    serif;

                font-size: 38px;

                font-weight: bold;

                margin: 22px 0;
            }


            .print-event {

                font-size: 25px;

                font-weight: bold;

                margin: 15px 0;
            }


            .print-info {

                margin-top: 30px;

                display: flex;

                justify-content: space-between;

                font-size: 14px;

                gap: 30px;
            }


            .print-signature {

                margin-top: 35px;

                display: flex;

                justify-content: space-around;
            }


            .signature-line {

                width: 200px;

                border-top: 1px solid #333;

                padding-top: 8px;
            }


            @page {

                size: landscape;

                margin: 0;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         NAVBAR
         ========================= -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="dashboard.html"
            >
                Campus Event Management
            </a>


            <div class="d-flex align-items-center">

                <span
                    id="studentName"
                    class="text-white me-3"
                >
                    Student
                </span>


                <button
                    class="btn btn-outline-light"
                    onclick="logout()"
                >
                    Logout
                </button>

            </div>

        </div>

    </nav>



    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <div class="container py-5">


        <div
            class="d-flex justify-content-between align-items-center mb-4"
        >

            <div>

                <h1>
                    My Certificates
                </h1>

                <p class="text-muted mb-0">

                    View and print certificates
                    issued for your events.

                </p>

            </div>


            <a
                href="dashboard.html"
                class="btn btn-secondary"
            >
                Back to Dashboard
            </a>

        </div>



        <!-- =========================
             LOADING
             ========================= -->

        <div
            id="loadingMessage"
            class="text-center py-5"
        >

            <div
                class="spinner-border text-primary"
                role="status"
            ></div>

            <p class="mt-3">
                Loading your certificates...
            </p>

        </div>



        <!-- =========================
             ERROR
             ========================= -->

        <div
            id="errorMessage"
            class="alert alert-danger d-none"
        ></div>



        <!-- =========================
             NO CERTIFICATES
             ========================= -->

        <div
            id="noCertificatesMessage"
            class="alert alert-info d-none"
        >
            You do not have any certificates yet.
        </div>



        <!-- =========================
             CERTIFICATES
             ========================= -->

        <div
            id="certificatesContainer"
            class="row"
        ></div>

    </div>



    <!-- =========================
         PRINT CERTIFICATE
         ========================= -->

    <div id="printCertificate"></div>



    <!-- API JS -->

    <script src="../js/api.js"></script>



    <script>

        /* =========================
           LOGIN CHECK
           ========================= */

        if (!isLoggedIn()) {

            window.location.href =
                "../login.html";
        }


        /* =========================
           ROLE CHECK
           ========================= */

        if (getUserRole() !== "STUDENT") {

            alert(
                "Access denied. Students only."
            );

            window.location.href =
                "../login.html";
        }


        /* =========================
           STUDENT NAME
           ========================= */

        const loggedInStudentName =
            getUserName();


        if (loggedInStudentName) {

            document.getElementById(
                "studentName"
            ).textContent =
                loggedInStudentName;
        }



        /* =========================
           LOAD CERTIFICATES
           ========================= */

        async function loadCertificates() {

            try {

                const userId =
                    getUserId();


                if (!userId) {

                    throw new Error(
                        "Student information not found. Please login again."
                    );
                }


                const certificates =
                    await apiRequest(
                        `/api/certificates/user/${userId}`
                    );


                document.getElementById(
                    "loadingMessage"
                ).classList.add("d-none");


                if (
                    !certificates ||
                    certificates.length === 0
                ) {

                    document.getElementById(
                        "noCertificatesMessage"
                    ).classList.remove("d-none");

                    return;
                }


                const container =
                    document.getElementById(
                        "certificatesContainer"
                    );


                container.innerHTML = "";


                certificates.forEach(
                    certificate => {

                        const col =
                            document.createElement(
                                "div"
                            );


                        col.className =
                            "col-md-6 col-xl-4 mb-4";


                        const studentName =
                            certificate.studentName ||
                            getUserName() ||
                            "Student";


                        const eventName =
                            certificate.eventName ||
                            "Event";


                        const certificateNumber =
                            certificate.certificateNumber ||
                            "Not available";


                        const issueDate =
                            certificate.issueDate ||
                            "Not available";



                        col.innerHTML = `

                            <div
                                class="certificate-card h-100 shadow-sm"
                            >

                                <div
                                    class="certificate-preview"
                                >

                                    <div
                                        class="text-center"
                                    >

                                        <!-- COLLEGE LOGO -->

                                        <img
                                            src="../images/rkgiot-logo.jpeg"
                                            alt="RKGIOT Logo"
                                            class="certificate-logo"
                                        >


                                        <!-- COLLEGE NAME -->

                                        <div
                                            class="college-name-preview"
                                        >
                                            RAJ KUMAR GOEL
                                            INSTITUTE OF TECHNOLOGY
                                        </div>


                                        <div
                                            class="college-subtitle-preview"
                                        >
                                            Campus Event Management System
                                        </div>


                                        <!-- TITLE -->

                                        <div
                                            class="certificate-title"
                                        >
                                            CERTIFICATE
                                        </div>


                                        <div
                                            class="certificate-subtitle"
                                        >
                                            OF PARTICIPATION
                                        </div>


                                        <hr class="my-3">


                                        <div
                                            class="small text-muted"
                                        >
                                            This certificate is proudly
                                            presented to
                                        </div>


                                        <!-- STUDENT -->

                                        <div
                                            class="student-name"
                                        >
                                            ${escapeHtml(studentName)}
                                        </div>


                                        <div
                                            class="small text-muted"
                                        >
                                            for participating in
                                        </div>


                                        <!-- EVENT -->

                                        <div
                                            class="event-name"
                                        >
                                            ${escapeHtml(eventName)}
                                        </div>


                                        <!-- DETAILS -->

                                        <div class="mt-4">

                                            <div
                                                class="certificate-number"
                                            >

                                                <strong>
                                                    Certificate No:
                                                </strong>

                                                ${escapeHtml(
                                                    certificateNumber
                                                )}

                                            </div>


                                            <div
                                                class="certificate-number mt-1"
                                            >

                                                <strong>
                                                    Issue Date:
                                                </strong>

                                                ${escapeHtml(
                                                    issueDate
                                                )}

                                            </div>

                                        </div>

                                    </div>

                                </div>



                                <!-- BUTTONS -->

                                <div
                                    class="certificate-actions"
                                >

                                    <button
                                        class="btn btn-primary w-100 mb-2"
                                        onclick="viewCertificate(${certificate.id})"
                                    >
                                        View Certificate
                                    </button>


                                    <button
                                        class="btn btn-outline-dark w-100"
                                        onclick="printCertificate(${certificate.id})"
                                    >
                                        🖨️ Print Certificate
                                    </button>

                                </div>

                            </div>

                        `;


                        container.appendChild(col);

                    }
                );

            }


            catch (error) {

                console.error(
                    "Error loading certificates:",
                    error
                );


                document.getElementById(
                    "loadingMessage"
                ).classList.add("d-none");


                const errorMessage =
                    document.getElementById(
                        "errorMessage"
                    );


                errorMessage.textContent =
                    error.message ||
                    "Unable to load certificates.";


                errorMessage.classList.remove(
                    "d-none"
                );
            }

        }



        /* =========================
           VIEW CERTIFICATE
           ========================= */

        async function viewCertificate(
            certificateId
        ) {

            try {

                const certificate =
                    await apiRequest(
                        `/api/certificates/${certificateId}`
                    );


                if (!certificate) {

                    throw new Error(
                        "Certificate not found."
                    );
                }


                const studentName =
                    certificate.studentName ||
                    getUserName() ||
                    "Student";


                const eventName =
                    certificate.eventName ||
                    "Event";


                alert(

                    "CERTIFICATE OF PARTICIPATION\n\n" +

                    "College: " +

                    "Raj Kumar Goel Institute of Technology" +

                    "\n\nStudent: " +

                    studentName +

                    "\n\nEvent: " +

                    eventName +

                    "\n\nCertificate Number: " +

                    (
                        certificate.certificateNumber ||
                        "N/A"
                    ) +

                    "\n\nIssue Date: " +

                    (
                        certificate.issueDate ||
                        "N/A"
                    )
                );

            }


            catch (error) {

                console.error(
                    "Error viewing certificate:",
                    error
                );


                alert(
                    error.message ||
                    "Unable to view certificate."
                );
            }

        }



        /* =========================
           PRINT CERTIFICATE
           ========================= */

        async function printCertificate(
            certificateId
        ) {

            try {

                const certificate =
                    await apiRequest(
                        `/api/certificates/${certificateId}`
                    );


                if (!certificate) {

                    throw new Error(
                        "Certificate not found."
                    );
                }


                const studentName =
                    certificate.studentName ||
                    getUserName() ||
                    "Student";


                const eventName =
                    certificate.eventName ||
                    "Event";


                const certificateNumber =
                    certificate.certificateNumber ||
                    "N/A";


                const issueDate =
                    certificate.issueDate ||
                    "N/A";


                const printContainer =
                    document.getElementById(
                        "printCertificate"
                    );



                printContainer.innerHTML = `

                    <div
                        class="print-certificate-page"
                    >

                        <div
                            class="print-certificate"
                        >

                            <div
                                class="print-certificate-inner"
                            >


                                <!-- LOGO -->

                                <img
                                    src="../images/rkgiot-logo.jpeg"
                                    alt="RKGIOT Logo"
                                    class="print-logo"
                                >



                                <!-- COLLEGE NAME -->

                                <div
                                    class="college-name"
                                >
                                    RAJ KUMAR GOEL
                                    INSTITUTE OF TECHNOLOGY
                                </div>


                                <div
                                    class="college-subtitle"
                                >
                                    Campus Event Management System
                                </div>



                                <!-- CERTIFICATE TITLE -->

                                <div
                                    class="print-title"
                                >
                                    CERTIFICATE OF PARTICIPATION
                                </div>



                                <div
                                    class="print-subtitle"
                                >
                                    This certificate is proudly
                                    presented to
                                </div>



                                <!-- STUDENT -->

                                <div
                                    class="print-student"
                                >
                                    ${escapeHtml(studentName)}
                                </div>



                                <div
                                    class="print-subtitle"
                                >
                                    for successfully participating in
                                </div>



                                <!-- EVENT -->

                                <div
                                    class="print-event"
                                >
                                    ${escapeHtml(eventName)}
                                </div>



                                <div
                                    class="print-subtitle"
                                >
                                    as part of the Campus Event
                                    Management System
                                </div>



                                <!-- DETAILS -->

                                <div
                                    class="print-info"
                                >

                                    <div>

                                        <strong>
                                            Certificate No:
                                        </strong>

                                        <br>

                                        ${escapeHtml(
                                            certificateNumber
                                        )}

                                    </div>


                                    <div>

                                        <strong>
                                            Issue Date:
                                        </strong>

                                        <br>

                                        ${escapeHtml(
                                            issueDate
                                        )}

                                    </div>

                                </div>



                                <!-- SIGNATURES -->

                                <div
                                    class="print-signature"
                                >

                                    <div>

                                        <div
                                            class="signature-line"
                                        >
                                            Organizer
                                        </div>

                                    </div>


                                    <div>

                                        <div
                                            class="signature-line"
                                        >
                                            Authorized Signature
                                        </div>

                                    </div>

                                </div>


                            </div>

                        </div>

                    </div>

                `;



                /* =========================
                   OPEN PRINT
                   ========================= */

                window.print();

            }


            catch (error) {

                console.error(
                    "Error printing certificate:",
                    error
                );


                alert(
                    error.message ||
                    "Unable to print certificate."
                );
            }

        }



        /* =========================
           HTML ESCAPE
           ========================= */

        function escapeHtml(value) {

            const div =
                document.createElement("div");


            div.textContent =
                value;


            return div.innerHTML;
        }



        /* =========================
           START
           ========================= */

        loadCertificates();

    </script>



    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>
</html>
