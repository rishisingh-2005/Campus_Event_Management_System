<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Certificates - Campus Event Management</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body class="bg-light">


    <!-- ========================================== -->
    <!-- NAVBAR -->
    <!-- ========================================== -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="dashboard.html"
            >
                Campus Event Management
            </a>

            <div class="d-flex align-items-center">

                <span
                    id="studentName"
                    class="text-white me-3"
                >
                    Student
                </span>

                <button
                    class="btn btn-outline-light"
                    onclick="logout()"
                >
                    Logout
                </button>

            </div>

        </div>

    </nav>


    <!-- ========================================== -->
    <!-- MAIN CONTENT -->
    <!-- ========================================== -->

    <div class="container py-5">


        <!-- Header -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h1>
                    My Certificates
                </h1>

                <p class="text-muted mb-0">
                    View certificates issued for your completed events.
                </p>

            </div>


            <a
                href="dashboard.html"
                class="btn btn-secondary"
            >
                Back to Dashboard
            </a>

        </div>


        <!-- ========================================== -->
        <!-- LOADING -->
        <!-- ========================================== -->

        <div
            id="loadingMessage"
            class="text-center py-5"
        >

            <div
                class="spinner-border text-primary"
                role="status"
            ></div>

            <p class="mt-3">
                Loading your certificates...
            </p>

        </div>


        <!-- ========================================== -->
        <!-- ERROR -->
        <!-- ========================================== -->

        <div
            id="errorMessage"
            class="alert alert-danger d-none"
        ></div>


        <!-- ========================================== -->
        <!-- NO CERTIFICATES -->
        <!-- ========================================== -->

        <div
            id="noCertificatesMessage"
            class="alert alert-info d-none"
        >
            You do not have any certificates yet.
        </div>


        <!-- ========================================== -->
        <!-- CERTIFICATE CONTAINER -->
        <!-- ========================================== -->

        <div
            id="certificatesContainer"
            class="row"
        ></div>


    </div>


    <!-- ========================================== -->
    <!-- API JAVASCRIPT -->
    <!-- ========================================== -->

    <script src="../js/api.js"></script>


    <script>


        // ==========================================
        // CHECK LOGIN
        // ==========================================

        if (!isLoggedIn()) {

            window.location.href = "../login.html";

        }


        // ==========================================
        // CHECK STUDENT ROLE
        // ==========================================

        if (getUserRole() !== "STUDENT") {

            alert("Access denied. Students only.");

            window.location.href = "../login.html";

        }


        // ==========================================
        // SHOW STUDENT NAME
        // ==========================================

        const studentName = getUserName();


        if (studentName) {

            document.getElementById(
                "studentName"
            ).textContent = studentName;

        }


        // ==========================================
        // LOAD CERTIFICATES
        // ==========================================

        async function loadCertificates() {

            try {

                const userId = getUserId();


                if (!userId) {

                    throw new Error(
                        "Student information not found. Please login again."
                    );

                }


                const certificates =
                    await apiRequest(
                        `/api/certificates/user/${userId}`
                    );


                // Hide loading

                document.getElementById(
                    "loadingMessage"
                ).classList.add("d-none");


                // No certificates

                if (
                    !certificates ||
                    certificates.length === 0
                ) {

                    document.getElementById(
                        "noCertificatesMessage"
                    ).classList.remove("d-none");

                    return;

                }


                const container =
                    document.getElementById(
                        "certificatesContainer"
                    );


                container.innerHTML = "";


                // Display certificates

                certificates.forEach(
                    certificate => {

                        const col =
                            document.createElement(
                                "div"
                            );


                        col.className =
                            "col-md-6 col-lg-4 mb-4";


                        col.innerHTML = `

                            <div class="card shadow-sm h-100">

                                <div class="card-body">

                                    <div class="text-center mb-3">

                                        <div
                                            class="display-5"
                                        >
                                            🏆
                                        </div>

                                        <h5 class="card-title mt-2">
                                            Certificate
                                        </h5>

                                    </div>


                                    <hr>


                                    <p class="mb-2">

                                        <strong>
                                            Certificate ID:
                                        </strong>

                                        ${certificate.id}

                                    </p>


                                    <p class="mb-2">

                                        <strong>
                                            Certificate Number:
                                        </strong>

                                        <br>

                                        <span class="text-primary">

                                            ${escapeHtml(
                                                certificate.certificateNumber ||
                                                "Not available"
                                            )}

                                        </span>

                                    </p>


                                    <p class="mb-3">

                                        <strong>
                                            Event ID:
                                        </strong>

                                        ${certificate.eventId}

                                    </p>


                                    <p class="mb-3">

                                        <strong>
                                            Issue Date:
                                        </strong>

                                        ${certificate.issueDate || "Not available"}

                                    </p>


                                    <button
                                        class="btn btn-primary w-100"
                                        onclick="viewCertificate(${certificate.id})"
                                    >
                                        View Certificate
                                    </button>

                                </div>

                            </div>

                        `;


                        container.appendChild(
                            col
                        );

                    }
                );


            }
            catch (error) {

                console.error(
                    "Error loading certificates:",
                    error
                );


                document.getElementById(
                    "loadingMessage"
                ).classList.add("d-none");


                const errorMessage =
                    document.getElementById(
                        "errorMessage"
                    );


                errorMessage.textContent =
                    error.message ||
                    "Unable to load certificates.";


                errorMessage.classList.remove(
                    "d-none"
                );

            }

        }


        // ==========================================
        // VIEW CERTIFICATE
        // ==========================================

        async function viewCertificate(certificateId) {

            try {

                const certificate =
                    await apiRequest(
                        `/api/certificates/${certificateId}`
                    );


                if (!certificate) {

                    throw new Error(
                        "Certificate not found."
                    );

                }


                alert(

                    "Certificate Details\n\n" +

                    "Certificate Number: " +
                    (certificate.certificateNumber || "N/A") +

                    "\n\nEvent ID: " +
                    (certificate.eventId || "N/A") +

                    "\n\nIssue Date: " +
                    (certificate.issueDate || "N/A")

                );

            }
            catch (error) {

                console.error(
                    "Error viewing certificate:",
                    error
                );


                alert(
                    error.message ||
                    "Unable to view certificate."
                );

            }

        }


        // ==========================================
        // ESCAPE HTML
        // ==========================================

        function escapeHtml(value) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent = value;

            return div.innerHTML;

        }


        // ==========================================
        // START
        // ==========================================

        loadCertificates();


    </script>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
