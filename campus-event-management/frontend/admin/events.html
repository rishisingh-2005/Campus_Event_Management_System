<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Events - Campus Event Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand"
                href="dashboard.html"
            >
                Campus Event Management
            </a>

            <button
                class="btn btn-outline-light"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </nav>


    <!-- Main Content -->

    <div class="container py-5">

        <div
            class="d-flex justify-content-between align-items-center mb-4"
        >

            <div>

                <h1>
                    Manage Events
                </h1>

                <p class="text-muted mb-0">
                    Review events submitted by organizers.
                </p>

            </div>

            <a
                href="dashboard.html"
                class="btn btn-secondary"
            >
                Back to Dashboard
            </a>

        </div>


        <!-- Loading -->

        <div
            id="loadingMessage"
            class="text-center py-5"
        >

            <div
                class="spinner-border"
                role="status"
            ></div>

            <p class="mt-3">
                Loading events...
            </p>

        </div>


        <!-- Error -->

        <div
            id="errorMessage"
            class="alert alert-danger"
            style="display: none;"
        ></div>


        <!-- No Events -->

        <div
            id="noEventsMessage"
            class="alert alert-info"
            style="display: none;"
        >

            No events found.

        </div>


        <!-- Events -->

        <div id="eventsContainer"></div>

    </div>


    <script src="../js/api.js"></script>


    <script>

        // Check login

        if (!isLoggedIn()) {

            window.location.href = "../login.html";

        }


        // Check admin role

        if (getUserRole() !== "ADMIN") {

            alert("Access denied. Admins only.");

            window.location.href = "../login.html";

        }


        async function loadEvents() {

            try {

                /*
                 * We will connect this page to the
                 * Admin Event API in the next backend step.
                 */

                const response =
                    await apiRequest("/api/admin/events");

                document.getElementById(
                    "loadingMessage"
                ).style.display = "none";


                if (!response || response.length === 0) {

                    document.getElementById(
                        "noEventsMessage"
                    ).style.display = "block";

                    return;

                }


                const container =
                    document.getElementById(
                        "eventsContainer"
                    );

                container.innerHTML = "";


                response.forEach(event => {

                    const card =
                        document.createElement("div");

                    card.className =
                        "card shadow-sm mb-4";


                    card.innerHTML = `

                        <div class="card-body">

                            <div class="d-flex justify-content-between align-items-center">

                                <div>

                                    <h4 class="mb-1">
                                        ${event.title}
                                    </h4>

                                    <p class="text-muted mb-0">

                                        Organizer ID:
                                        ${event.organizerId || "N/A"}

                                    </p>

                                </div>


                                <span
                                    class="badge ${
                                        event.status &&
                                        event.status.toUpperCase() === "APPROVED"
                                            ? "bg-success"
                                            : event.status &&
                                              event.status.toUpperCase() === "REJECTED"
                                                ? "bg-danger"
                                                : "bg-warning text-dark"
                                    }"
                                >

                                    ${event.status || "UNKNOWN"}

                                </span>

                            </div>


                            <hr>


                            <div class="row">

                                <div class="col-md-6">

                                    <p>
                                        <strong>Description:</strong>
                                        ${event.description || "N/A"}
                                    </p>

                                    <p>
                                        <strong>Date:</strong>
                                        ${event.date || "N/A"}
                                    </p>

                                    <p>
                                        <strong>Time:</strong>
                                        ${event.time || "N/A"}
                                    </p>

                                </div>


                                <div class="col-md-6">

                                    <p>
                                        <strong>Venue:</strong>
                                        ${event.venue || "N/A"}
                                    </p>

                                    <p>
                                        <strong>Category:</strong>
                                        ${event.category || "N/A"}
                                    </p>

                                    <p>
                                        <strong>Capacity:</strong>
                                        ${event.capacity || "N/A"}
                                    </p>

                                </div>

                            </div>


                            ${
                                event.status &&
                                event.status.toUpperCase() === "PENDING"
                                    ? `

                                    <div class="mt-3">

                                        <button
                                            class="btn btn-success me-2"
                                            onclick="approveEvent(${event.id})"
                                        >
                                            Approve
                                        </button>


                                        <button
                                            class="btn btn-danger"
                                            onclick="rejectEvent(${event.id})"
                                        >
                                            Reject
                                        </button>

                                    </div>

                                    `
                                    : ""
                            }

                        </div>

                    `;


                    container.appendChild(card);

                });

            }

            catch (error) {

                console.error(
                    "Error loading events:",
                    error
                );


                document.getElementById(
                    "loadingMessage"
                ).style.display = "none";


                document.getElementById(
                    "errorMessage"
                ).textContent =
                    error.message ||
                    "Unable to load events.";


                document.getElementById(
                    "errorMessage"
                ).style.display = "block";

            }

        }


        async function approveEvent(eventId) {

            if (
                !confirm(
                    "Are you sure you want to approve this event?"
                )
            ) {

                return;

            }


            try {

                await apiRequest(
                    `/api/admin/events/${eventId}/approve`,
                    {
                        method: "PUT"
                    }
                );


                alert(
                    "Event approved successfully."
                );


                loadEvents();

            }

            catch (error) {

                alert(
                    error.message ||
                    "Unable to approve event."
                );

            }

        }


        async function rejectEvent(eventId) {

            if (
                !confirm(
                    "Are you sure you want to reject this event?"
                )
            ) {

                return;

            }


            try {

                await apiRequest(
                    `/api/admin/events/${eventId}/reject`,
                    {
                        method: "PUT"
                    }
                );


                alert(
                    "Event rejected successfully."
                );


                loadEvents();

            }

            catch (error) {

                alert(
                    error.message ||
                    "Unable to reject event."
                );

            }

        }


        loadEvents();

    </script>

</body>

</html>
