<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard - Campus Event Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand"
                href="dashboard.html"
            >
                Campus Event Management
            </a>

            <button
                class="btn btn-outline-light"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </nav>


    <!-- Dashboard -->

    <div class="container py-5">

        <h1>
            Admin Dashboard
        </h1>

        <p class="text-muted">
            Welcome, <span id="adminName"></span>
        </p>


        <!-- Dashboard Cards -->

        <div class="row mt-4">

            <div class="col-md-4 mb-4">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h4>
                            Event Management
                        </h4>

                        <p>
                            Review and manage events submitted
                            by organizers.
                        </p>

                        <a
                            href="events.html"
                            class="btn btn-primary"
                        >
                            Manage Events
                        </a>

                    </div>

                </div>

            </div>


            <div class="col-md-4 mb-4">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h4>
                            User Management
                        </h4>

                        <p>
                            View and manage registered users.
                        </p>

                        <a
                            href="users.html"
                            class="btn btn-primary"
                        >
                            Manage Users
                        </a>

                    </div>

                </div>

            </div>


            <div class="col-md-4 mb-4">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h4>
                            Reports
                        </h4>

                        <p>
                            View event and registration information.
                        </p>

                        <button
                            class="btn btn-secondary"
                            disabled
                        >
                            Reports
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="../js/api.js"></script>


    <script>

        // Check login

        if (!isLoggedIn()) {

            window.location.href = "../login.html";

        }


        // Check admin role

        if (getUserRole() !== "ADMIN") {

            alert("Access denied. Admins only.");

            window.location.href = "../login.html";

        }


        // Display admin name

        document.getElementById(
            "adminName"
        ).textContent = getUserName() || "Admin";

    </script>

</body>

</html>
