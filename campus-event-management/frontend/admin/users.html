<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Users - Campus Event Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand"
                href="dashboard.html"
            >
                Campus Event Management
            </a>

            <button
                class="btn btn-outline-light"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </nav>


    <!-- Main Content -->

    <div class="container py-5">

        <div
            class="d-flex justify-content-between align-items-center mb-4"
        >

            <div>

                <h1>
                    Manage Users
                </h1>

                <p class="text-muted mb-0">
                    View users registered in the system.
                </p>

            </div>

            <a
                href="dashboard.html"
                class="btn btn-secondary"
            >
                Back to Dashboard
            </a>

        </div>


        <!-- Loading -->

        <div
            id="loadingMessage"
            class="text-center py-5"
        >

            <div
                class="spinner-border"
                role="status"
            ></div>

            <p class="mt-3">
                Loading users...
            </p>

        </div>


        <!-- Error -->

        <div
            id="errorMessage"
            class="alert alert-danger"
            style="display: none;"
        ></div>


        <!-- No Users -->

        <div
            id="noUsersMessage"
            class="alert alert-info"
            style="display: none;"
        >

            No users found.

        </div>


        <!-- Users Table -->

        <div
            id="usersContainer"
            style="display: none;"
        >

            <div class="table-responsive">

                <table
                    class="table table-bordered table-hover align-middle"
                >

                    <thead class="table-dark">

                        <tr>

                            <th>
                                #
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Role
                            </th>

                        </tr>

                    </thead>

                    <tbody id="usersTableBody"></tbody>

                </table>

            </div>

        </div>

    </div>


    <script src="../js/api.js"></script>


    <script>

        // Check login

        if (!isLoggedIn()) {

            window.location.href = "../login.html";

        }


        // Check admin role

        if (getUserRole() !== "ADMIN") {

            alert("Access denied. Admins only.");

            window.location.href = "../login.html";

        }


        async function loadUsers() {

            try {

                const users =
                    await apiRequest(
                        "/api/admin/users"
                    );


                document.getElementById(
                    "loadingMessage"
                ).style.display = "none";


                if (!users || users.length === 0) {

                    document.getElementById(
                        "noUsersMessage"
                    ).style.display = "block";

                    return;

                }


                const tableBody =
                    document.getElementById(
                        "usersTableBody"
                    );

                tableBody.innerHTML = "";


                users.forEach((user, index) => {

                    const row =
                        document.createElement("tr");


                    let roleClass =
                        "bg-secondary";

                    if (
                        user.role &&
                        user.role.toUpperCase() === "ADMIN"
                    ) {

                        roleClass = "bg-danger";

                    }
                    else if (
                        user.role &&
                        user.role.toUpperCase() === "ORGANIZER"
                    ) {

                        roleClass = "bg-primary";

                    }
                    else if (
                        user.role &&
                        user.role.toUpperCase() === "STUDENT"
                    ) {

                        roleClass = "bg-success";

                    }


                    row.innerHTML = `

                        <td>
                            ${index + 1}
                        </td>

                        <td>
                            ${user.name || "N/A"}
                        </td>

                        <td>
                            ${user.email || "N/A"}
                        </td>

                        <td>

                            <span class="badge ${roleClass}">

                                ${user.role || "UNKNOWN"}

                            </span>

                        </td>

                    `;


                    tableBody.appendChild(row);

                });


                document.getElementById(
                    "usersContainer"
                ).style.display = "block";

            }

            catch (error) {

                console.error(
                    "Error loading users:",
                    error
                );


                document.getElementById(
                    "loadingMessage"
                ).style.display = "none";


                document.getElementById(
                    "errorMessage"
                ).textContent =
                    error.message ||
                    "Unable to load users.";


                document.getElementById(
                    "errorMessage"
                ).style.display = "block";

            }

        }


        loadUsers();

    </script>

</body>

</html>
