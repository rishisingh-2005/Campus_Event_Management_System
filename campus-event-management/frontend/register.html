<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register - Campus Events</title>

    <!-- ================= BOOTSTRAP ================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- ================= CUSTOM CSS ================= -->

    <link
        rel="stylesheet"
        href="css/style.css">

    <!-- ================= PAGE STYLING ================= -->

    <style>

        body {
            min-height: 100vh;
        }

        .register-wrapper {
            min-height: calc(100vh - 56px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 560px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .register-card .card-body {
            padding: 40px;
        }

        .register-title {
            font-size: 2.2rem;
            font-weight: 500;
            color: #111827;
        }

        .register-subtitle {
            color: #4b5563;
            font-size: 1.1rem;
        }

        .form-label {
            font-size: 1.05rem;
            font-weight: 500;
        }

        .form-control {
            min-height: 48px;
            border-radius: 7px;
            font-size: 1rem;
        }

        .register-button {
            min-height: 48px;
            border-radius: 7px;
            font-size: 1.05rem;
            font-weight: 500;
        }

        .login-link {
            font-size: 1.05rem;
        }

        .login-link a {
            font-weight: 500;
        }

        /* ==========================
           ACCOUNT TYPE
        ========================== */

        .account-type-box {
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 16px;
            background: #f8f9fa;
        }

        .account-option {
            border: 1px solid #dee2e6;
            border-radius: 9px;
            padding: 14px;
            background: white;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .account-option:hover {
            border-color: #0d6efd;
            background: #f8fbff;
        }

        .account-option.active {
            border-color: #0d6efd;
            background: #eef5ff;
        }

        .account-option input {
            margin-right: 8px;
        }

        .account-option-title {
            font-weight: 600;
        }

        .account-option-description {
            display: block;
            margin-left: 25px;
            margin-top: 4px;
            color: #6c757d;
            font-size: 13px;
        }

        .organizer-info {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 8px;
            background: #fff3cd;
            border: 1px solid #ffe69c;
            color: #664d03;
            font-size: 14px;
        }

        .organizer-info.show {
            display: block;
        }

        @media (max-width: 576px) {

            .register-card .card-body {
                padding: 28px 22px;
            }

            .register-title {
                font-size: 1.9rem;
            }

            .register-subtitle {
                font-size: 1rem;
            }

        }

    </style>

</head>


<body class="bg-light">


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="./index.html">

                Campus Events

            </a>

            <a
                href="./login.html"
                class="btn btn-outline-light">

                Login

            </a>

        </div>

    </nav>


    <!-- ================= REGISTER SECTION ================= -->

    <main class="register-wrapper">

        <div class="register-card card">

            <div class="card-body">


                <!-- ================= TITLE ================= -->

                <h1
                    class="register-title text-center mb-3">

                    Create Account

                </h1>


                <p
                    class="register-subtitle text-center mb-4">

                    Register for your Campus Events account

                </p>


                <!-- ================= REGISTER FORM ================= -->

                <form id="registerForm">


                    <!-- ================= ACCOUNT TYPE ================= -->

                    <div class="mb-4">

                        <label class="form-label d-block">
                            Account Type
                        </label>

                        <div class="account-type-box">

                            <!-- STUDENT -->

                            <label
                                class="account-option active d-block mb-2"
                                id="studentOption">

                                <input
                                    type="radio"
                                    name="accountType"
                                    value="STUDENT"
                                    checked>

                                <span class="account-option-title">
                                    🎓 Student Account
                                </span>

                                <span class="account-option-description">
                                    Register for events and manage your attendance.
                                </span>

                            </label>


                            <!-- ORGANIZER -->

                            <label
                                class="account-option d-block"
                                id="organizerOption">

                                <input
                                    type="radio"
                                    name="accountType"
                                    value="ORGANIZER">

                                <span class="account-option-title">
                                    🧑‍💼 Organizer Account
                                </span>

                                <span class="account-option-description">
                                    Request approval to create and manage campus events.
                                </span>

                            </label>


                            <div
                                id="organizerInfo"
                                class="organizer-info">

                                <strong>
                                    Organizer approval required
                                </strong>

                                <br>

                                Your request will be sent to an administrator.
                                You can log in as an organizer only after your
                                request has been approved.

                            </div>

                        </div>

                    </div>


                    <!-- ================= NAME ================= -->

                    <div class="mb-3">

                        <label
                            for="name"
                            class="form-label">

                            Full Name

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required>

                    </div>


                    <!-- ================= EMAIL ================= -->

                    <div class="mb-3">

                        <label
                            for="email"
                            class="form-label">

                            Email

                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>


                    <!-- ================= PASSWORD ================= -->

                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label">

                            Password

                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="new-password"
                            minlength="6"
                            required>

                    </div>


                    <!-- ================= CONFIRM PASSWORD ================= -->

                    <div class="mb-3">

                        <label
                            for="confirmPassword"
                            class="form-label">

                            Confirm Password

                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            minlength="6"
                            required>

                    </div>


                    <!-- ================= ERROR MESSAGE ================= -->

                    <div
                        id="errorMessage"
                        class="alert alert-danger d-none"
                        role="alert">

                    </div>


                    <!-- ================= SUCCESS MESSAGE ================= -->

                    <div
                        id="successMessage"
                        class="alert alert-success d-none"
                        role="alert">

                    </div>


                    <!-- ================= REGISTER BUTTON ================= -->

                    <button
                        type="submit"
                        id="registerButton"
                        class="btn btn-primary w-100 register-button">

                        Create Student Account

                    </button>

                </form>


                <!-- ================= LOGIN LINK ================= -->

                <p
                    class="text-center mt-4 mb-0 login-link">

                    Already have an account?

                    <a href="./login.html">

                        Login here

                    </a>

                </p>

            </div>

        </div>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const API_BASE_URL =
            "https://campuseventmanagementsystem-production.up.railway.app";


        // ===============================
        // ACCOUNT TYPE ELEMENTS
        // ===============================

        const studentOption =
            document.getElementById(
                "studentOption"
            );

        const organizerOption =
            document.getElementById(
                "organizerOption"
            );

        const organizerInfo =
            document.getElementById(
                "organizerInfo"
            );

        const registerButton =
            document.getElementById(
                "registerButton"
            );

        const registerForm =
            document.getElementById(
                "registerForm"
            );

        const errorMessage =
            document.getElementById(
                "errorMessage"
            );

        const successMessage =
            document.getElementById(
                "successMessage"
            );


        // ===============================
        // UPDATE ACCOUNT TYPE UI
        // ===============================

        function updateAccountTypeUI() {

            const accountType =
                document.querySelector(
                    'input[name="accountType"]:checked'
                ).value;


            if (accountType === "ORGANIZER") {

                studentOption.classList.remove(
                    "active"
                );

                organizerOption.classList.add(
                    "active"
                );

                organizerInfo.classList.add(
                    "show"
                );

                registerButton.textContent =
                    "Request Organizer Account";

            } else {

                organizerOption.classList.remove(
                    "active"
                );

                studentOption.classList.add(
                    "active"
                );

                organizerInfo.classList.remove(
                    "show"
                );

                registerButton.textContent =
                    "Create Student Account";

            }

        }


        document.querySelectorAll(
            'input[name="accountType"]'
        ).forEach(input => {

            input.addEventListener(
                "change",
                updateAccountTypeUI
            );

        });


        // ===============================
        // FORM SUBMISSION
        // ===============================

        registerForm.addEventListener(
            "submit",
            async (e) => {

                e.preventDefault();

                errorMessage.classList.add(
                    "d-none"
                );

                successMessage.classList.add(
                    "d-none"
                );


                const name =
                    document.getElementById(
                        "name"
                    ).value.trim();

                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();

                const password =
                    document.getElementById(
                        "password"
                    ).value;

                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;

                const role =
                    document.querySelector(
                        'input[name="accountType"]:checked'
                    ).value;


                if (password !== confirmPassword) {

                    errorMessage.textContent =
                        "Passwords do not match.";

                    errorMessage.classList.remove(
                        "d-none"
                    );

                    return;

                }


                registerButton.disabled = true;

                const originalBtnText =
                    registerButton.textContent;

                registerButton.textContent =
                    "Processing...";


                try {

                  const endpoint =
    role === "ORGANIZER"
        ? `${API_BASE_URL}/api/organizer-requests`
        : `${API_BASE_URL}/api/users`;
                    const response = await fetch(
                        endpoint,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                name,
                                email,
                                password,
                                role
                            })
                        }
                    );

                    const data =
                        await response.json().catch(() => ({}));


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Registration failed. Please try again."
                        );

                    }


                    registerForm.reset();

                    updateAccountTypeUI();


                    if (role === "ORGANIZER") {

                        successMessage.innerHTML =
                            "Your request to become an organizer has been submitted! An admin will review it soon. You can log in once approved.";

                    } else {

                        successMessage.innerHTML =
                            "Account created successfully! Redirecting to login...";

                        setTimeout(() => {

                            window.location.href =
                                "./login.html";

                        }, 2000);

                    }

                    successMessage.classList.remove(
                        "d-none"
                    );


                } catch (error) {

                    errorMessage.textContent =
                        error.message;

                    errorMessage.classList.remove(
                        "d-none"
                    );

                } finally {

                    registerButton.disabled = false;

                    registerButton.textContent =
                        originalBtnText;

                }

            }
        );

    </script>


</body>

</html>
