<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register - Campus Events</title>


    <!-- ================= BOOTSTRAP ================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- ================= CUSTOM CSS ================= -->

    <link
        rel="stylesheet"
        href="css/style.css">


    <!-- ================= PAGE STYLING ================= -->

    <style>

        body {
            min-height: 100vh;
        }

        .register-wrapper {
            min-height: calc(100vh - 56px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 560px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .register-card .card-body {
            padding: 40px;
        }

        .register-title {
            font-size: 2.2rem;
            font-weight: 500;
            color: #111827;
        }

        .register-subtitle {
            color: #4b5563;
            font-size: 1.1rem;
        }

        .form-label {
            font-size: 1.05rem;
            font-weight: 500;
        }

        .form-control {
            min-height: 48px;
            border-radius: 7px;
            font-size: 1rem;
        }

        .register-button {
            min-height: 48px;
            border-radius: 7px;
            font-size: 1.05rem;
            font-weight: 500;
        }

        .login-link {
            font-size: 1.05rem;
        }

        .login-link a {
            font-weight: 500;
        }

        @media (max-width: 576px) {

            .register-card .card-body {
                padding: 28px 22px;
            }

            .register-title {
                font-size: 1.9rem;
            }

            .register-subtitle {
                font-size: 1rem;
            }

        }

    </style>

</head>


<body class="bg-light">


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="./index.html">

                Campus Events

            </a>


            <a
                href="./login.html"
                class="btn btn-outline-light">

                Login

            </a>

        </div>

    </nav>


    <!-- ================= REGISTER SECTION ================= -->

    <main class="register-wrapper">

        <div class="register-card card">

            <div class="card-body">


                <!-- ================= TITLE ================= -->

                <h1
                    class="register-title text-center mb-3">

                    Create Account

                </h1>


                <p
                    class="register-subtitle text-center mb-4">

                    Register for your Campus Events account

                </p>


                <!-- ================= REGISTER FORM ================= -->

                <form id="registerForm">


                    <!-- ================= NAME ================= -->

                    <div class="mb-3">

                        <label
                            for="name"
                            class="form-label">

                            Full Name

                        </label>


                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required>

                    </div>


                    <!-- ================= EMAIL ================= -->

                    <div class="mb-3">

                        <label
                            for="email"
                            class="form-label">

                            Email

                        </label>


                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>


                    <!-- ================= PASSWORD ================= -->

                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label">

                            Password

                        </label>


                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="new-password"
                            minlength="6"
                            required>

                    </div>


                    <!-- ================= CONFIRM PASSWORD ================= -->

                    <div class="mb-3">

                        <label
                            for="confirmPassword"
                            class="form-label">

                            Confirm Password

                        </label>


                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            minlength="6"
                            required>

                    </div>


                    <!-- ================= ERROR MESSAGE ================= -->

                    <div
                        id="errorMessage"
                        class="alert alert-danger d-none"
                        role="alert">

                    </div>


                    <!-- ================= SUCCESS MESSAGE ================= -->

                    <div
                        id="successMessage"
                        class="alert alert-success d-none"
                        role="alert">

                    </div>


                    <!-- ================= REGISTER BUTTON ================= -->

                    <button
                        type="submit"
                        id="registerButton"
                        class="btn btn-primary w-100 register-button">

                        Create Account

                    </button>

                </form>


                <!-- ================= LOGIN LINK ================= -->

                <p
                    class="text-center mt-4 mb-0 login-link">

                    Already have an account?

                    <a href="./login.html">

                        Login here

                    </a>

                </p>

            </div>

        </div>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const API_BASE_URL =
            "http://localhost:8080";


        // ===============================
        // REGISTER FORM
        // ===============================

        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    // ===============================
                    // GET FORM VALUES
                    // ===============================

                    const name =
                        document
                            .getElementById("name")
                            .value
                            .trim();

                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();

                    const password =
                        document
                            .getElementById("password")
                            .value;

                    const confirmPassword =
                        document
                            .getElementById("confirmPassword")
                            .value;


                    const errorMessage =
                        document
                            .getElementById("errorMessage");

                    const successMessage =
                        document
                            .getElementById("successMessage");

                    const registerButton =
                        document
                            .getElementById("registerButton");


                    // ===============================
                    // CLEAR MESSAGES
                    // ===============================

                    errorMessage.textContent = "";

                    errorMessage.classList.add(
                        "d-none"
                    );

                    successMessage.textContent = "";

                    successMessage.classList.add(
                        "d-none"
                    );


                    // ===============================
                    // VALIDATE PASSWORD
                    // ===============================

                    if (password !== confirmPassword) {

                        errorMessage.textContent =
                            "Passwords do not match.";

                        errorMessage.classList.remove(
                            "d-none"
                        );

                        return;
                    }


                    // ===============================
                    // DISABLE BUTTON
                    // ===============================

                    registerButton.disabled = true;

                    registerButton.textContent =
                        "Creating Account...";


                    try {

                        // ===============================
                        // SEND REGISTRATION REQUEST
                        // ===============================

                        const response =
                            await fetch(
                                `${API_BASE_URL}/api/users`,
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body: JSON.stringify({

                                        name: name,

                                        email: email,

                                        password: password

                                    })
                                }
                            );


                        // ===============================
                        // READ RESPONSE
                        // ===============================

                        const responseText =
                            await response.text();


                        // ===============================
                        // HANDLE ERROR
                        // ===============================

                        if (!response.ok) {

                            let message =
                                responseText;

                            try {

                                const errorData =
                                    JSON.parse(
                                        responseText
                                    );

                                if (
                                    errorData.message
                                ) {

                                    message =
                                        errorData.message;

                                }

                            } catch (error) {

                                // Response was not JSON.
                                // Use response text.

                            }


                            if (
                                !message ||
                                message.trim() === ""
                            ) {

                                if (
                                    response.status === 409
                                ) {

                                    message =
                                        "Email is already registered.";

                                } else {

                                    message =
                                        "Registration failed. Please try again.";

                                }

                            }


                            throw new Error(
                                message
                            );
                        }


                        // ===============================
                        // SUCCESS
                        // ===============================

                        successMessage.textContent =
                            "Account created successfully! Redirecting to login...";

                        successMessage.classList.remove(
                            "d-none"
                        );


                        // Clear form

                        document
                            .getElementById("registerForm")
                            .reset();


                        // ===============================
                        // REDIRECT TO LOGIN
                        // ===============================

                        setTimeout(
                            function() {

                                window.location.href =
                                    "./login.html";

                            },
                            1500
                        );

                    }

                    catch (error) {

                        console.error(
                            "Registration error:",
                            error
                        );


                        errorMessage.textContent =
                            error.message ||
                            "Registration failed. Please try again.";

                        errorMessage.classList.remove(
                            "d-none"
                        );

                    }

                    finally {

                        registerButton.disabled =
                            false;

                        registerButton.textContent =
                            "Create Account";

                    }

                });

    </script>


    <!-- ================= BOOTSTRAP JAVASCRIPT ================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
