<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Events - Campus Event Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand"
                href="dashboard.html"
            >
                Campus Event Management
            </a>

            <button
                class="btn btn-outline-light"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </nav>


    <!-- Main Content -->
    <div class="container py-5">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h1>My Events</h1>

                <p class="text-muted mb-0">
                    Events created by you
                </p>

            </div>

            <div>

                <a
                    href="create-event.html"
                    class="btn btn-primary"
                >
                    Create New Event
                </a>

            </div>

        </div>


        <!-- Loading -->
        <div
            id="loadingMessage"
            class="text-center py-5"
        >

            <div
                class="spinner-border"
                role="status"
            ></div>

            <p class="mt-3">
                Loading your events...
            </p>

        </div>


        <!-- Error -->
        <div
            id="errorMessage"
            class="alert alert-danger"
            style="display: none;"
        ></div>


        <!-- No Events -->
        <div
            id="noEventsMessage"
            class="alert alert-info"
            style="display: none;"
        >

            You have not created any events yet.

        </div>


        <!-- Events -->
        <div
            id="eventsContainer"
            class="row g-4"
        ></div>

    </div>


    <!-- API -->
    <script src="../js/api.js"></script>


    <script>

        // ==========================================
        // LOGIN CHECK
        // ==========================================

        if (!isLoggedIn()) {

            window.location.href = "../login.html";

        }


        // ==========================================
        // ORGANIZER ROLE CHECK
        // ==========================================

        if (getUserRole() !== "ORGANIZER") {

            alert("Access denied. Organizers only.");

            window.location.href = "../login.html";

        }


        // ==========================================
        // LOAD MY EVENTS
        // ==========================================

        async function loadMyEvents() {

            try {

                const events =
                    await apiRequest(
                        "/api/organizer/events"
                    );


                // Hide loading
                document.getElementById(
                    "loadingMessage"
                ).style.display = "none";


                // No events
                if (!events || events.length === 0) {

                    document.getElementById(
                        "noEventsMessage"
                    ).style.display = "block";

                    return;

                }


                const container =
                    document.getElementById(
                        "eventsContainer"
                    );


                container.innerHTML = "";


                // Create event cards
                events.forEach(event => {

                    const card =
                        document.createElement("div");


                    card.className =
                        "col-md-6 col-lg-4";


                    // Determine status badge
                    let statusClass =
                        "bg-secondary";


                    if (
                        event.status &&
                        event.status.toUpperCase() === "APPROVED"
                    ) {

                        statusClass =
                            "bg-success";

                    }
                    else if (
                        event.status &&
                        event.status.toUpperCase() === "PENDING"
                    ) {

                        statusClass =
                            "bg-warning text-dark";

                    }
                    else if (
                        event.status &&
                        event.status.toUpperCase() === "REJECTED"
                    ) {

                        statusClass =
                            "bg-danger";

                    }


                    card.innerHTML = `

                        <div class="card h-100 shadow-sm">

                            <div class="card-body d-flex flex-column">

                                <h4 class="card-title">
                                    ${event.title}
                                </h4>


                                <p class="card-text text-muted">
                                    ${event.description || "No description available."}
                                </p>


                                <hr>


                                <p class="mb-2">
                                    <strong>Date:</strong>
                                    ${event.date || "N/A"}
                                </p>


                                <p class="mb-2">
                                    <strong>Time:</strong>
                                    ${event.time || "N/A"}
                                </p>


                                <p class="mb-2">
                                    <strong>Venue:</strong>
                                    ${event.venue || "N/A"}
                                </p>


                                <p class="mb-2">
                                    <strong>Category:</strong>
                                    ${event.category || "N/A"}
                                </p>


                                <p class="mb-3">
                                    <strong>Capacity:</strong>
                                    ${event.capacity || "N/A"}
                                </p>


                                <p class="mb-3">

                                    <strong>Status:</strong>

                                    <span class="badge ${statusClass}">
                                        ${event.status || "UNKNOWN"}
                                    </span>

                                </p>


                                <div class="mt-auto d-flex gap-2 flex-wrap">

                                    <!-- Edit Event -->
                                    <a
                                        href="edit-event.html?id=${event.id}"
                                        class="btn btn-outline-primary"
                                    >
                                        Edit Event
                                    </a>


                                    <!-- Manage Attendance -->
                                    <a
                                        href="attendance.html?eventId=${event.id}"
                                        class="btn btn-primary"
                                    >
                                        Manage Attendance
                                    </a>

                                </div>

                            </div>

                        </div>

                    `;


                    container.appendChild(card);

                });

            }

            catch (error) {

                console.error(
                    "Error loading organizer events:",
                    error
                );


                document.getElementById(
                    "loadingMessage"
                ).style.display = "none";


                document.getElementById(
                    "errorMessage"
                ).textContent =
                    error.message ||
                    "Unable to load your events.";


                document.getElementById(
                    "errorMessage"
                ).style.display = "block";

            }

        }


        // ==========================================
        // START
        // ==========================================

        loadMyEvents();

    </script>

</body>

</html>
