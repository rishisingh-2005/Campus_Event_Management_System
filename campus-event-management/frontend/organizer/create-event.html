<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Event - Campus Event Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand"
                href="dashboard.html"
            >
                Campus Event Management
            </a>

            <button
                class="btn btn-outline-light"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </nav>


    <!-- Main Content -->
    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-7">

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h2 class="mb-2">
                            Create Event
                        </h2>

                        <p class="text-muted mb-4">
                            Enter the details of your campus event.
                        </p>


                        <!-- Success Message -->
                        <div
                            id="successMessage"
                            class="alert alert-success"
                            style="display: none;"
                        >
                        </div>


                        <!-- Error Message -->
                        <div
                            id="errorMessage"
                            class="alert alert-danger"
                            style="display: none;"
                        >
                        </div>


                        <!-- Event Form -->
                        <form id="eventForm">


                            <!-- Title -->
                            <div class="mb-3">

                                <label
                                    for="title"
                                    class="form-label"
                                >
                                    Event Title
                                </label>

                                <input
                                    type="text"
                                    id="title"
                                    class="form-control"
                                    placeholder="Enter event title"
                                    required
                                >

                            </div>


                            <!-- Description -->
                            <div class="mb-3">

                                <label
                                    for="description"
                                    class="form-label"
                                >
                                    Description
                                </label>

                                <textarea
                                    id="description"
                                    class="form-control"
                                    rows="4"
                                    placeholder="Enter event description"
                                    required
                                ></textarea>

                            </div>


                            <!-- Date -->
                            <div class="mb-3">

                                <label
                                    for="date"
                                    class="form-label"
                                >
                                    Event Date
                                </label>

                                <input
                                    type="date"
                                    id="date"
                                    class="form-control"
                                    required
                                >

                            </div>


                            <!-- Time -->
                            <div class="mb-3">

                                <label
                                    for="time"
                                    class="form-label"
                                >
                                    Event Time
                                </label>

                                <input
                                    type="time"
                                    id="time"
                                    class="form-control"
                                    required
                                >

                            </div>


                            <!-- Venue -->
                            <div class="mb-3">

                                <label
                                    for="venue"
                                    class="form-label"
                                >
                                    Venue
                                </label>

                                <input
                                    type="text"
                                    id="venue"
                                    class="form-control"
                                    placeholder="Enter event venue"
                                    required
                                >

                            </div>


                            <!-- Category -->
                            <div class="mb-3">

                                <label
                                    for="category"
                                    class="form-label"
                                >
                                    Category
                                </label>

                                <select
                                    id="category"
                                    class="form-select"
                                    required
                                >

                                    <option value="">
                                        Select category
                                    </option>

                                    <option value="TECHNOLOGY">
                                        Technology
                                    </option>

                                    <option value="CULTURAL">
                                        Cultural
                                    </option>

                                    <option value="SPORTS">
                                        Sports
                                    </option>

                                    <option value="WORKSHOP">
                                        Workshop
                                    </option>

                                    <option value="SEMINAR">
                                        Seminar
                                    </option>

                                    <option value="OTHER">
                                        Other
                                    </option>

                                </select>

                            </div>


                            <!-- Capacity -->
                            <div class="mb-3">

                                <label
                                    for="capacity"
                                    class="form-label"
                                >
                                    Capacity
                                </label>

                                <input
                                    type="number"
                                    id="capacity"
                                    class="form-control"
                                    placeholder="Enter maximum number of students"
                                    min="1"
                                    required
                                >

                            </div>


                            <!-- Registration Deadline -->
                            <div class="mb-4">

                                <label
                                    for="registrationDeadline"
                                    class="form-label"
                                >
                                    Registration Deadline
                                </label>

                                <input
                                    type="date"
                                    id="registrationDeadline"
                                    class="form-control"
                                    required
                                >

                            </div>


                            <!-- Buttons -->
                            <div class="d-flex gap-2">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Create Event
                                </button>

                                <a
                                    href="dashboard.html"
                                    class="btn btn-secondary"
                                >
                                    Cancel
                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- API JavaScript -->
    <script src="../js/api.js"></script>


    <script>

        // ==========================================
        // LOGIN CHECK
        // ==========================================

        if (!isLoggedIn()) {

            window.location.href = "../login.html";

        }


        // ==========================================
        // ORGANIZER ROLE CHECK
        // ==========================================

        if (getUserRole() !== "ORGANIZER") {

            alert("Access denied. Organizers only.");

            window.location.href = "../login.html";

        }


        // ==========================================
        // CREATE EVENT
        // ==========================================

        document
            .getElementById("eventForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


                // Hide previous messages
                document.getElementById(
                    "successMessage"
                ).style.display = "none";

                document.getElementById(
                    "errorMessage"
                ).style.display = "none";


                // Get form values
                const title =
                    document.getElementById("title").value.trim();

                const description =
                    document.getElementById("description").value.trim();

                const date =
                    document.getElementById("date").value;

                const time =
                    document.getElementById("time").value;

                const venue =
                    document.getElementById("venue").value.trim();

                const category =
                    document.getElementById("category").value;

                const capacity =
                    document.getElementById("capacity").value;

                const registrationDeadline =
                    document.getElementById(
                        "registrationDeadline"
                    ).value;


                try {

                    /*
                     * We are sending the event data
                     * to the backend.
                     *
                     * The backend endpoint will be
                     * connected in the next step if
                     * it does not already exist.
                     */

                    const data = await apiRequest(
                        "/api/organizer/events",
                        {
                            method: "POST",

                            body: JSON.stringify({

                                title: title,

                                description: description,

                                date: date,

                                time: time,

                                venue: venue,

                                category: category,

                                capacity: Number(capacity),

                                registrationDeadline:
                                    registrationDeadline,

                                status: "PENDING"

                            })
                        }
                    );


                    console.log(
                        "Created event:",
                        data
                    );


                    // Show success message
                    document.getElementById(
                        "successMessage"
                    ).textContent =
                        "Event created successfully and submitted for admin approval.";

                    document.getElementById(
                        "successMessage"
                    ).style.display = "block";


                    // Reset form
                    document.getElementById(
                        "eventForm"
                    ).reset();

                }

                catch (error) {

                    console.error(
                        "Error creating event:",
                        error
                    );


                    document.getElementById(
                        "errorMessage"
                    ).textContent =
                        error.message ||
                        "Unable to create event.";

                    document.getElementById(
                        "errorMessage"
                    ).style.display = "block";

                }

            });

    </script>

</body>

</html>
